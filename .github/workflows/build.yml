name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The signing key lives in this repo's private Actions cache (never in git), so every
      # build is signed with the same key and installs over the previous one.
      # Repo secrets SIGNING_KEY_B64 + SIGNING_PASSWORD, if set, take priority.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: signing
          key: tvhome-signing-v1

      - name: Signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          mkdir -p signing
          if [ -n "$SIGNING_KEY_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > signing/tvhome.jks
            printf '%s' "$SIGNING_PASSWORD" > signing/pass.txt
          elif [ ! -f signing/tvhome.jks ] || [ ! -f signing/pass.txt ]; then
            openssl rand -hex 24 > signing/pass.txt
            P=$(cat signing/pass.txt)
            keytool -genkeypair -keystore signing/tvhome.jks -storepass "$P" -keypass "$P" \
              -alias tvhome -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TV Home"
            echo "::notice::Created a new signing key; later builds reuse it from the cache."
          fi
          echo "::add-mask::$(cat signing/pass.txt)"

      - name: Build release APK
        run: SIGNING_PASSWORD="$(cat signing/pass.txt)" gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tv-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tv-home
          path: tv-home.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Home (latest build)
          body: Install tv-home.apk on the TV. Built from ${{ github.sha }}.
          files: tv-home.apk
          make_latest: true
